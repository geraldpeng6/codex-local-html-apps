<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>贪吃蛇</title>
  <style>
    :root { color-scheme:dark; --bg:#101526; --panel:#192238; --line:#34415a; --text:#eef4ed; --muted:#a8b5ba; --green:#b9f586; --pink:#ff668b; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 16px; color:var(--text); background:var(--bg); font-family:"Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif; }
    .app { width:min(100%,520px); margin:auto; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .eyebrow { margin:0 0 7px; font:11px "Courier New",monospace; letter-spacing:3px; color:var(--green); }
    h1 { margin:0; font-size:30px; letter-spacing:2px; }
    .mark { width:48px; height:48px; display:grid; place-items:center; border:1px solid var(--line); border-radius:14px; color:var(--green); }
    .hud { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:16px; }
    .stat { background:var(--panel); padding:12px 16px; }
    .stat span { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .stat strong { font:25px "Courier New",monospace; }
    .board { position:relative; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
    canvas { display:block; width:100%; height:auto; background:#0b1020; touch-action:none; outline:none; }
    canvas:focus-visible { box-shadow:inset 0 0 0 2px var(--green); }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; background:rgba(11,16,32,.76); backdrop-filter:blur(3px); }
    .overlay[hidden] { display:none; }
    .overlay h2 { margin:0 0 8px; font-size:26px; }
    .overlay p { color:var(--muted); margin:0 0 22px; line-height:1.6; }
    button { cursor:pointer; font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 18px; }
    button:hover { border-color:var(--green); }
    button:focus-visible { outline:2px solid var(--green); outline-offset:3px; }
    button:active { transform:translateY(1px); }
    button.primary { color:#122019; background:var(--green); border-color:var(--green); font-weight:bold; }
    .actions { display:flex; gap:10px; margin-top:16px; }
    .actions button { flex:1; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:16px; }
    .hint { margin:0; color:var(--muted); font-size:12px; line-height:1.9; }
    .dpad { display:grid; grid-template-columns:repeat(3,38px); gap:4px; }
    .dpad button { padding:7px 0; border-radius:7px; font-size:15px; }
    #up { grid-column:2; } #left { grid-column:1; grid-row:2; } #down { grid-column:2;grid-row:2; } #right { grid-column:3;grid-row:2; }
    @media(max-width:360px) { body{padding:16px 10px} .stat{padding:10px} .footer{gap:8px} .hint{font-size:11px} }
  </style>
</head>
<body>
<main class="app">
  <header><div><p class="eyebrow">ONE MORE BITE</p><h1>贪吃蛇</h1></div><div class="mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 20 20" fill="none"><path d="M4 15h8a3 3 0 0 0 0-6H7a3 3 0 0 1 0-6h7v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="4.5" r=".7" fill="currentColor"/></svg></div></header>
  <div class="hud"><div class="stat"><span>分数</span><strong id="score">0</strong></div><div class="stat"><span>最高分</span><strong id="best">0</strong></div><div class="stat"><span>速度</span><strong id="speed">1</strong></div></div>
  <div class="board"><canvas id="game" width="400" height="400" tabindex="0" aria-label="贪吃蛇游戏画布，方向键或 WASD 转向"></canvas><div class="overlay" id="overlay"><h2 id="message">准备好了吗？</h2><p id="detail">吃掉粉色果实，继续长大。<br>可以穿墙，别撞到自己。</p><button class="primary" id="start">开始游戏</button></div></div>
  <div class="actions"><button id="pause">开始</button><button id="restart">重新开始</button></div>
  <div class="footer"><p class="hint">方向键 / WASD 转向<br>空格暂停 · R 重开<br>也可以点击方向按钮或滑动棋盘</p><div class="dpad" aria-label="方向控制"><button id="up" aria-label="向上">↑</button><button id="left" aria-label="向左">←</button><button id="down" aria-label="向下">↓</button><button id="right" aria-label="向右">→</button></div></div>
</main>
<script>
  // Adapted from the user's existing snake.html; the game stays entirely local.
  const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score"), speedEl = document.getElementById("speed"), bestEl = document.getElementById("best");
  const pauseBtn = document.getElementById("pause"), overlay = document.getElementById("overlay"), startBtn = document.getElementById("start");
  const unit = 20, cols = canvas.width / unit, rows = canvas.height / unit;
  let snake, dir, nextDir, food, score, level, tickMs, timer, state = "ready", best = 0;
  try { best = Number(localStorage.getItem("snake-game-best-v1")) || 0; } catch {}
  bestEl.textContent = best;
  function randomFood() {
    const occupied = new Set(snake.map(seg => `${seg.x},${seg.y}`));
    const free = [];
    for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) if (!occupied.has(`${x},${y}`)) free.push({x,y});
    return free.length ? free[Math.floor(Math.random()*free.length)] : null;
  }
  function resetGame(play = true) {
    clearInterval(timer);
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dir = {x:1,y:0}; nextDir = {...dir};
    food = randomFood(); score = 0; level = 1; tickMs = 180;
    scoreEl.textContent = score; speedEl.textContent = level; state = play ? "running" : "ready";
    overlay.hidden = play; pauseBtn.textContent = play ? "暂停" : "开始";
    if(play) { timer = setInterval(step,tickMs); canvas.focus({preventScroll:true}); }
    draw();
  }
  function roundRect(x,y,w,h,r) { ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
  function draw() {
    ctx.fillStyle = "#0b1020"; ctx.fillRect(0,0,400,400);
    ctx.strokeStyle = "#192235"; ctx.lineWidth = .5;
    for(let i=0;i<=cols;i++) { ctx.beginPath(); ctx.moveTo(i*unit,0);ctx.lineTo(i*unit,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*unit);ctx.lineTo(400,i*unit);ctx.stroke(); }
    if(food) { ctx.fillStyle = "#ff668b"; roundRect(food.x*unit+3,food.y*unit+3,14,14,5); }
    snake.forEach((seg,i)=> { ctx.fillStyle = i===0 ? "#c8ff96" : "#76c66b";roundRect(seg.x*unit+1,seg.y*unit+1,18,18,i===0?6:4); });
    const h=snake[0];ctx.fillStyle="#102019";
    const perpendicular={x:-dir.y,y:dir.x};
    for(const side of [-1,1]) { ctx.beginPath();ctx.arc(h.x*unit+10+dir.x*4+perpendicular.x*side*4,h.y*unit+10+dir.y*4+perpendicular.y*side*4,1.4,0,Math.PI*2);ctx.fill(); }
  }
  function finish(won=false) {
    clearInterval(timer); state="over";overlay.hidden=false;pauseBtn.textContent="再来一局";
    document.getElementById("message").textContent=won?"你吃满了整个棋盘！":"下次再多吃一口";
    document.getElementById("detail").textContent=`本局 ${score} 分 · 最高 ${best} 分`;
    startBtn.textContent="再来一局";
  }
  function step() {
    if(state!=="running")return;
    dir=nextDir;const head=snake[0];const next={x:(head.x+dir.x+cols)%cols,y:(head.y+dir.y+rows)%rows};
    const eating=food&&next.x===food.x&&next.y===food.y;
    // A moving tail vacates its cell on the same tick; eating grows by one segment.
    if(snake.slice(0,eating?snake.length:snake.length-1).some(seg=>seg.x===next.x&&seg.y===next.y)) {finish();return;}
    snake.unshift(next);
    if(eating) {
      score+=10;scoreEl.textContent=score;
      if(score>best) {best=score;bestEl.textContent=best;try{localStorage.setItem("snake-game-best-v1",String(best));}catch{}}
      food=randomFood();if(!food){draw();finish(true);return;}
      if(score%30===0&&tickMs>70) {level++;speedEl.textContent=level;tickMs=Math.max(70,tickMs-12);clearInterval(timer);timer=setInterval(step,tickMs);}
    } else snake.pop();
    draw();
  }
  function setDirection(x,y) { if(state!=="running"||x===-dir.x&&y===-dir.y)return;nextDir={x,y};canvas.focus({preventScroll:true}); }
  function togglePause() {
    if(state==="ready"||state==="over"){resetGame();return;}
    if(state==="running") {clearInterval(timer);state="paused";overlay.hidden=false;document.getElementById("message").textContent="歇一口";document.getElementById("detail").textContent="准备好了就继续。";startBtn.textContent="继续游戏";pauseBtn.textContent="继续";}
    else {state="running";overlay.hidden=true;pauseBtn.textContent="暂停";timer=setInterval(step,tickMs);canvas.focus({preventScroll:true});}
  }
  const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  window.addEventListener("keydown",e=> {if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;const key=e.key.length===1?e.key.toLowerCase():e.key;if(keys[key]){e.preventDefault();setDirection(...keys[key]);}else if(key===" "){e.preventDefault();togglePause();}else if(key==="r"){e.preventDefault();resetGame();}});
  for(const [id,vector] of Object.entries({up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]})) document.getElementById(id).addEventListener("click",()=>setDirection(...vector));
  startBtn.addEventListener("click",()=>state==="paused"?togglePause():resetGame());
  pauseBtn.addEventListener("click",togglePause);document.getElementById("restart").addEventListener("click",()=>resetGame());
  let touchStart;
  canvas.addEventListener("pointerdown",e=>{touchStart={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener("pointerup",e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;Math.abs(dx)>Math.abs(dy)?setDirection(Math.sign(dx),0):setDirection(0,Math.sign(dy));});
  canvas.addEventListener("pointercancel",()=>touchStart=null);
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="running")togglePause();});
  resetGame(false);

  // Official MCP Apps postMessage bridge, also usable as a standalone preview.
  if(window.parent!==window) {
    let rpcId=0;const pending=new Map();
    const notify=(method,params)=>window.parent.postMessage({jsonrpc:"2.0",method,params},"*");
    const request=(method,params)=>new Promise((resolve,reject)=>{const id=++rpcId;const timeout=setTimeout(()=>{pending.delete(id);reject(new Error("Host initialization timed out"));},10000);pending.set(id,{resolve,reject,timeout});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");});
    window.addEventListener("message",event=>{
      if(event.source!==window.parent||event.data?.jsonrpc!=="2.0")return;
      const message=event.data;
      if(message.id!=null&&!message.method){const item=pending.get(message.id);if(!item)return;clearTimeout(item.timeout);pending.delete(message.id);message.error?item.reject(message.error):item.resolve(message.result);}
      else if(message.method==="ui/resource-teardown"){clearInterval(timer);window.parent.postMessage({jsonrpc:"2.0",id:message.id,result:{}},"*");}
    });
    request("ui/initialize",{appInfo:{name:"local-html-apps",version:"1.1.0"},appCapabilities:{},protocolVersion:"2026-01-26"}).then(()=>{
      notify("ui/notifications/initialized",{});
      const reportSize=()=>notify("ui/notifications/size-changed",{height:Math.ceil(document.querySelector(".app").getBoundingClientRect().height)+48});
      reportSize();new ResizeObserver(reportSize).observe(document.querySelector(".app"));
    }).catch(error=>console.warn("MCP App host bridge unavailable:",error.message||error));
  }
</script>
</body>
</html>
