<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫雷</title>
<style>:root{color-scheme:dark;--bg:#14100e;--card:#211813;--line:#4c382b;--ink:#fff4e6;--muted:#bd9f85;--amber:#ffb35c;--red:#ff5d70;--green:#7bdf94}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(18px,4vw,44px);color:var(--ink);background:radial-gradient(700px 340px at 85% -5%,#6e341838,transparent),linear-gradient(145deg,var(--bg),#070403);font-family:"Avenir Next","PingFang SC","Noto Sans SC",sans-serif}.wrap{width:min(670px,100%);margin:auto}.eyebrow{margin:0 0 8px;color:var(--amber);font:800 11px/1 "Courier New",monospace;letter-spacing:.33em}h1{margin:0 0 19px;font-size:clamp(31px,6vw,46px);letter-spacing:-.035em}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-bottom:15px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}.cellbar{background:var(--card);padding:12px 14px}.cellbar span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.cellbar strong{font:22px "Courier New",monospace}button,select{cursor:pointer;color:var(--ink);font:inherit;background:#2b2018;border:1px solid var(--line);border-radius:10px;padding:10px 15px}button.primary{color:#3a1a04;background:linear-gradient(135deg,#ffcf84,var(--amber));font-weight:700;border-color:transparent}.board{display:grid;gap:3px;padding:11px;border:1px solid var(--line);border-radius:18px;background:#120d0a;touch-action:manipulation}.tile{position:relative;display:grid;place-items:center;min-width:0;aspect-ratio:1;border:0;border-radius:8px;background:#33261c;color:#f7e9d7;font:800 clamp(12px,3.4vw,17px)/1 "Courier New",monospace;transition:transform .12s ease,background .12s}.tile:before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 2px 0 #ffffff14,inset 0 -2px 0 #00000030}.tile:not(.open):hover{background:#3f2f22;transform:translateY(-1px)}.tile.open{background:#1b1511;box-shadow:inset 0 0 0 1px #ffffff08}.tile.flag:before{content:"🚩";position:static;box-shadow:none;font-size:clamp(11px,3vw,15px)}.tile.boom{background:var(--red);color:#fff}.c1{color:#89e4ff}.c2{color:#8ce59a}.c3{color:#ffab66}.c4{color:#e69bff}.c5{color:#ff8080}.c6{color:#7ff0dd}.c7{color:#f8c7d8}.c8{color:#d7c5ff}.note{margin:17px 3px 0;color:var(--muted);font-size:12px;line-height:1.7}.win{color:var(--green)!important}.lose{color:var(--red)!important}@media(max-width:430px){.controls{gap:7px}button,select{padding:9px 12px;font-size:13px}}</style>
</head><body><main class="wrap"><p class="eyebrow">SAFE FIRST CLICK</p><h1>扫雷</h1><div class="status"><div class="cellbar"><span>剩余雷数</span><strong id="mines">10</strong></div><div class="cellbar"><span>用时</span><strong id="clock">0:00</strong></div><div class="cellbar"><span>状态</span><strong id="state">准备</strong></div></div><div class="controls"><select id="level"><option value="9,9,10">入门 · 9×9</option><option value="13,10,22">进阶 · 13×10</option><option value="16,12,35">挑战 · 16×12</option></select><button class="primary" id="restart">新开局</button><button id="flagMode">插旗模式：关</button></div><div class="board" id="board" aria-label="扫雷棋盘，右键或长按插旗"></div><p class="note">点击翻开；右键或开启插旗模式后点击标记。<strong>首次点击永远不会踩雷。</strong>数字表示周围八格的雷数。</p></main>
<script>
const boardEl=document.getElementById('board'),stateEl=document.getElementById('state'),mineEl=document.getElementById('mines'),clockEl=document.getElementById('clock'),flagBtn=document.getElementById('flagMode');let W,H,mines,cells,started,over,flags,timer=0,seconds=0,flagMode=false;const neighbors=i=>{const r=Math.floor(i/W),c=i%W,out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<H&&cc>=0&&cc<W)out.push(rr*W+cc)}return out};const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
function build(){[W,H,mines]=document.getElementById('level').value.split(',').map(Number);clearInterval(timer);timer=0;seconds=0;clockEl.textContent='0:00';started=over=false;flags=0;stateEl.textContent='准备';stateEl.className='';mineEl.textContent=mines;cells=Array.from({length:W*H},()=>({mine:false,open:false,flag:false,count:0,el:null}));boardEl.style.gridTemplateColumns=`repeat(${W},1fr)`;boardEl.replaceChildren(...cells.map((cell,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label',`第 ${i%W+1} 列第 ${Math.floor(i/W)+1} 行`);b.addEventListener('click',()=>flagMode?toggleFlag(i):reveal(i));b.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i)});let press; b.addEventListener('pointerdown',e=>{if(e.button===2)return;press=setTimeout(()=>{press=null;toggleFlag(i)},450)});b.addEventListener('pointerup',()=>{if(press){clearTimeout(press);press=null}});cell.el=b;return b}));}
function place(first){const safe=new Set([first,...neighbors(first)]);const pool=cells.map((_,i)=>i).filter(i=>!safe.has(i));for(let n=0;n<mines;n++){const k=Math.floor(Math.random()*pool.length),i=pool.splice(k,1)[0];cells[i].mine=true}cells.forEach((cell,i)=>cell.count=neighbors(i).filter(n=>cells[n].mine).length)}
function reveal(i){if(over||cells[i].flag||cells[i].open)return;if(!started){place(i);started=true;stateEl.textContent='进行中';timer=setInterval(()=>{seconds++;clockEl.textContent=fmt(seconds)},1000)}const cell=cells[i];if(cell.mine){lose(i);return}const stack=[i];while(stack.length){const n=stack.pop(),c=cells[n];if(c.open||c.flag)continue;c.open=true;c.el.classList.add('open');if(c.count){c.el.textContent=c.count;c.el.classList.add('c'+c.count)}else neighbors(n).forEach(x=>{if(!cells[x].open)stack.push(x)})}check()}
function toggleFlag(i){if(over||cells[i].open)return;const c=cells[i];c.flag=!c.flag;flags+=c.flag?1:-1;c.el.classList.toggle('flag',c.flag);mineEl.textContent=Math.max(0,mines-flags)}function lose(hit){over=true;clearInterval(timer);cells.forEach(c=>{if(c.mine)c.el.classList.add('open');if(c.mine&&!c.flag)c.el.textContent='💥'});cells[hit].el.classList.add('boom');stateEl.textContent='踩到雷';stateEl.className='lose'}
function check(){if(cells.every(c=>c.open||c.mine)){over=true;clearInterval(timer);stateEl.textContent='全部排除';stateEl.className='win';cells.forEach(c=>{if(c.mine&&!c.flag)c.el.classList.add('flag')})}}
flagBtn.onclick=()=>{flagMode=!flagMode;flagBtn.textContent=`插旗模式：${flagMode?'开':'关'}`};document.getElementById('restart').onclick=build;document.getElementById('level').onchange=build;document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!over){clearInterval(timer)}else if(started&&!over){timer=setInterval(()=>{seconds++;clockEl.textContent=fmt(seconds)},1000)}});build();
if(window.parent!==window){let id=0;const pending=new Map(),send=(m,p)=>parent.postMessage({jsonrpc:'2.0',method:m,params:p},'*'),ask=(m,p)=>new Promise((res,rej)=>{const x=++id,t=setTimeout(()=>rej(new Error('timeout')),9000);pending.set(x,{res,rej,t});send(m,p)});addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const d=e.data;if(d.id!=null&&!d.method){const x=pending.get(d.id);if(x){clearTimeout(x.t);pending.delete(d.id);d.error?x.rej(d.error):x.res(d.result)}}else if(d.method==='ui/resource-teardown'){clearInterval(timer);parent.postMessage({jsonrpc:'2.0',id:d.id,result:{}},'*')}});ask('ui/initialize',{appInfo:{name:'local-html-apps',version:'1.1.2'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{send('ui/notifications/initialized',{});const rs=()=>send('ui/notifications/size-changed',{height:Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+46});rs();new ResizeObserver(rs).observe(document.querySelector('.wrap'))}).catch(e=>console.warn(e.message))}
</script></body></html>
