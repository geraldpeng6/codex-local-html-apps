<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加密货币实时价格</title>
<style>:root{color-scheme:dark;--bg:#0a0904;--card:#181405;--line:#54451c;--ink:#fffbe9;--muted:#c2ab75;--gold:#ffc94a;--amber:#ff9f43;--up:#8df3a4;--down:#ff848f}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(19px,4vw,47px);color:var(--ink);background:radial-gradient(650px 310px at 12% -8%,#8a5c1440,transparent),radial-gradient(760px 350px at 92% 12%,#7a451026,transparent),linear-gradient(145deg,var(--bg),#040302);font-family:"Avenir Next","PingFang SC","Noto Sans SC",sans-serif}.wrap{width:min(870px,100%);margin:auto}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--gold);font:800 11px/1 "Courier New",monospace;letter-spacing:.31em}.eyebrow:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}h1{margin:16px 0 6px;font-size:clamp(32px,6.2vw,50px);letter-spacing:-.04em}.sub{margin:0 0 23px;color:var(--muted);font-size:13px}.toolbar{display:flex;justify-content:space-between;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font:700 11px "Courier New",monospace;letter-spacing:.16em}.dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px #8df3a424}.dot.paused{background:var(--amber);box-shadow:0 0 0 4px #ffc94a22}button{cursor:pointer;color:var(--ink);font:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 16px}button.primary{color:#372203;background:linear-gradient(135deg,#ffe289,var(--gold));font-weight:750;border-color:transparent}.ticker{margin-bottom:16px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.coin{position:relative;overflow:hidden;padding:20px;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#221a07,var(--card));box-shadow:0 19px 45px #00000058}.coin:before{content:"";position:absolute;right:-45px;top:-42px;width:135px;height:135px;border-radius:50%;background:#ffc94a12}.top{display:flex;justify-content:space-between;align-items:flex-start}.pair{font:800 19px "Courier New",monospace;letter-spacing:-.01em}.rank{margin-top:5px;color:var(--muted);font:700 10px "Courier New",monospace;letter-spacing:.18em}.price{margin:20px 0 4px;font:800 clamp(27px,6.2vw,34px)/1 "Courier New",monospace}.chg{font:750 14px "Courier New",monospace}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}.bars{display:grid;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid #ffffff0d;font-size:11px;color:var(--muted)}.row{display:flex;justify-content:space-between}.track{height:4px;background:#ffffff10;border-radius:9px;overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--amber))}.flash{animation:flash .45s ease}@keyframes flash{0%{color:var(--gold);transform:translateY(-1px)}100%{color:inherit;transform:none}}.error{border:1px solid #734;border-radius:16px;padding:16px;color:#ffb7be;background:#3a1220;margin-bottom:14px;display:none}.empty{min-height:190px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:420px){.coin{padding:17px}}</style>
</head><body><main class="wrap"><p class="eyebrow">BINANCE PUBLIC REST</p><h1>加密货币实时价格</h1><p class="sub">每 10 秒读取一次公开行情；页面关闭或卸载时自动停止计时。</p><div class="toolbar"><p class="live"><span class="dot" id="dot"></span><span id="mode">LIVE</span></p><div style="display:flex;gap:8px"><button id="pause">暂停</button><button class="primary" id="refresh">立即刷新</button></div></div><div id="error" class="error"></div><p class="ticker" id="updated">尚未加载数据</p><section class="grid" id="grid" aria-live="polite"></section></main>
<script>
const SYMBOLS=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT'],grid=document.getElementById('grid'),updated=document.getElementById('updated'),errorEl=document.getElementById('error');let rows=SYMBOLS.map(s=>({symbol:s,price:null})),timer=null,paused=false,last=0;
const fmt=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),compact=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(2)+'K':fmt(n,0);
function render(){grid.innerHTML=rows.map((r,i)=>{const c=cache[i],cls=c&&c.priceChangePercent>0?'up':c&&c.priceChangePercent<0?'down':'flat';return`<article class="coin"><div class="top"><span><span class="pair">${r.symbol.replace('USDT',' / USDT')}</span><span class="rank">24H ${c?(c.priceChangePercent>=0?'+':'')+Number(c.priceChangePercent).toFixed(2)+'%':'读取中'}</span></span><span class="chg ${cls}">${c?(c.priceChange>=0?'+':'')+compact(Number(c.priceChange)):''}</span></div><p class="price ${r.price!==r.prev?'flash':''}">${c?fmt(c.lastPrice):'—'}</p><div class="bars"><div class="row"><span>24H 最高</span><span>${c?fmt(c.highPrice):'—'}</span></div><div class="row"><span>24H 最低</span><span>${c?fmt(c.lowPrice):'—'}</span></div><div class="row"><span>24H 成交额</span><span>${c?compact(Number(c.quoteVolume))+' USDT':'—'}</span></div><div class="row"><span>价格位置</span><span>${c?(((c.lastPrice-c.lowPrice)/Math.max(c.highPrice-c.lowPrice,1e-9))*100).toFixed(0)+'%':'—'}</span></div><div class="track"><div class="fill" style="width:${c?((c.lastPrice-c.lowPrice)/Math.max(c.highPrice-c.lowPrice,1e-9))*100:0}%"></div></div></div></article>`}).join('')||'<div class="empty">加载中…</div>'}
const cache=[];async function refresh(){errorEl.style.display='none';updated.textContent='读取 Binance…';try{const symbols=encodeURIComponent(JSON.stringify(SYMBOLS)),r=await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbols}`,{signal:AbortSignal.timeout(10000)});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();SYMBOLS.forEach((s,i)=>{cache[i]=data.find(x=>x.symbol===s)||null;rows[i].prev=rows[i].price;rows[i].price=cache[i]?.lastPrice??null});render();last=Date.now();updated.textContent=`Binance 现货 · ${new Date(last).toLocaleTimeString('zh-CN')}`}catch(e){errorEl.textContent=`读取失败：${e.message||e}。检查网络或接口访问权限；显示的可能是上一次数据。`;errorEl.style.display='block';updated.textContent=`更新失败 · 上次成功 ${last?new Date(last).toLocaleTimeString('zh-CN'):'无'}`}}
function start(){if(timer)return;timer=setInterval(refresh,10000);paused=false;document.getElementById('mode').textContent='LIVE';document.getElementById('dot').classList.remove('paused');document.getElementById('pause').textContent='暂停'}function stop(){clearInterval(timer);timer=null;paused=true;document.getElementById('mode').textContent='PAUSED';document.getElementById('dot').classList.add('paused');document.getElementById('pause').textContent='继续'}document.getElementById('pause').onclick=()=>paused?start():stop();document.getElementById('refresh').onclick=refresh;addEventListener('visibilitychange',()=>document.hidden?stop():start());render();refresh();start();
</script></body></html>
