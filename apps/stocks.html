<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股票行情</title>
<style>:root{color-scheme:dark;--bg:#071018;--card:#0e1e2c;--line:#254456;--ink:#eef9ff;--muted:#8caebf;--cyan:#6ff2ff;--blue:#6f8bff;--up:#78e5a6;--down:#ff808d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(18px,4vw,46px);color:var(--ink);background:radial-gradient(640px 320px at 82% -12%,#215a7338,transparent),linear-gradient(150deg,var(--bg),#010810);font-family:"Avenir Next","PingFang SC","Noto Sans SC",sans-serif}.wrap{width:min(860px,100%);margin:auto}.eyebrow{margin:0 0 8px;color:var(--cyan);font:800 11px/1 "Courier New",monospace;letter-spacing:.32em}h1{margin:0 0 7px;font-size:clamp(31px,6vw,47px);letter-spacing:-.035em}.sub{margin:0 0 24px;color:var(--muted);font-size:13px}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.input{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 4px 3px 14px}.input input{flex:1;min-width:0;border:0;outline:0;color:var(--ink);background:transparent;font:inherit;padding:11px 0}.btn,button{cursor:pointer;color:var(--ink);font:inherit;background:#123040;border:1px solid var(--line);border-radius:12px;padding:12px 17px;transition:border-color .2s}.btn.primary{color:#03242b;background:linear-gradient(135deg,#9efaff,#64cfff);border-color:transparent;font-weight:750}.btn:hover{border-color:var(--cyan)}.ticker{margin-bottom:11px;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.quote{position:relative;overflow:hidden;padding:19px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#102a3c,var(--card));box-shadow:0 18px 45px #0005}.quote:before{content:"";position:absolute;width:110px;height:110px;right:-31px;top:-45px;border-radius:50%;background:#6ff2ff17}.sym{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}.name{font-size:19px;font-weight:780}.exch{display:block;margin-top:4px;color:var(--muted);font:650 10px "Courier New",monospace;letter-spacing:.16em}.price{margin:17px 0 3px;font:800 clamp(30px,7vw,37px)/1 "Courier New",monospace}.change{font:740 14px "Courier New",monospace}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:16px;border-top:1px solid #ffffff0d;padding-top:12px}.spark{display:block;width:100%;height:44px;margin-top:13px}.empty,.error{display:grid;place-items:center;min-height:200px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center;padding:20px;line-height:1.65}.error{color:#ffb7be;border-color:#663038}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{cursor:pointer;border:1px solid var(--line);color:var(--muted);background:#0a1824;border-radius:99px;padding:6px 11px;font:650 11px "Courier New",monospace;letter-spacing:.06em}.chip:hover{color:var(--cyan);border-color:var(--cyan)}@media(max-width:430px){.quote{padding:16px}.price{font-size:29px}}</style>
</head><body><main class="wrap"><p class="eyebrow">TENCENT QUOTES · PUBLIC API</p><h1>股票行情</h1><p class="sub">支持美股、港股、A股和指数；可用常见名称或完整代码添加。数据仅作参考，不构成投资建议。</p><div class="bar" id="form"><label class="input"><span aria-hidden="true">🔎</span><input list="popular" id="symbol" value="Apple" placeholder="输入 Apple、腾讯、贵州茅台、usAAPL、hk00700" aria-label="股票常见名称或代码"><datalist id="popular"><option>Apple</option><option>腾讯</option><option>贵州茅台</option><option>usNVDA</option><option>hk00700</option></datalist></label><button class="btn primary" id="add" type="button">添加</button><button class="btn" id="refresh" type="button">刷新</button></div><div class="chips" id="quick" aria-label="快速添加"></div><p class="ticker" id="updated">尚未加载数据</p><section class="cards" id="cards" aria-live="polite"></section></main>
<script>
const DEFAULT=['usAAPL','usMSFT','usNVDA','usTSLA','hk00700'],key='html-apps-stock-symbols-v2',cards=document.getElementById('cards'),updated=document.getElementById('updated'),quick=document.getElementById('quick');let symbols=[],cache={},errors={};try{symbols=JSON.parse(localStorage.getItem(key))||[]}catch{}symbols=symbols.filter(Boolean).slice(0,8);if(!symbols.length)symbols=DEFAULT.slice(0,4);
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(key,JSON.stringify(symbols))}catch{}}function fmt(n,d=2){return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})}
function spark(points,up){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 100 30');svg.setAttribute('class','spark');svg.setAttribute('preserveAspectRatio','none');if(points&&points.length>1){let mn=Math.min(...points),mx=Math.max(...points);if(mx===mn)mx=mn+1;const d=points.map((v,i)=>`${i?'L':'M'}${(i/(points.length-1)*100).toFixed(2)},${(27-((v-mn)/(mx-mn))*24).toFixed(2)}`).join(' ');const line=document.createElementNS(ns,'path');line.setAttribute('d',d);line.setAttribute('fill','none');line.setAttribute('stroke',up>=0?'#78e5a6':'#ff808d');line.setAttribute('stroke-width','1.8');line.setAttribute('stroke-linecap','round');svg.append(line)}return svg}
async function resolveSymbol(input){const q=input.trim(),aliases={'apple':'usAAPL','苹果':'usAAPL','microsoft':'usMSFT','微软':'usMSFT','nvidia':'usNVDA','英伟达':'usNVDA','tesla':'usTSLA','特斯拉':'usTSLA','腾讯':'hk00700','腾讯控股':'hk00700','贵州茅台':'sh600519','茅台':'sh600519','上证指数':'sh000001'};if(!q)throw new Error('请输入常见名称或完整代码');if(aliases[q.toLowerCase()])return aliases[q.toLowerCase()];if(/^(us[A-Za-z0-9.]+|sh[0-9]{6}|sz[0-9]{6}|bj[0-9]{6}|hk[0-9]{5})$/i.test(q))return q.slice(0,2).toLowerCase()+(q.slice(0,2).toLowerCase()==='us'?q.slice(2).toUpperCase():q.slice(2));if(/^[A-Za-z][A-Za-z0-9.]{0,11}$/.test(q))return 'us'+q.toUpperCase();if(/^[0-9]{4,6}$/.test(q))return q.length<=5?'hk'+q.padStart(5,'0'):(/^[659]/.test(q)?'sh':/^[48]/.test(q)?'bj':'sz')+q;throw new Error('未收录该名称，请输入完整代码，如 sh600519 或 hk00700')}
async function fetchQuote(symbol){const r=await fetch(`https://qt.gtimg.cn/q=${encodeURIComponent(symbol)}`,{signal:AbortSignal.timeout(10000)});if(!r.ok)throw new Error(`HTTP ${r.status}`);const body=new TextDecoder('gb18030').decode(await r.arrayBuffer());const values=body.split('="',2)[1]?.split('";',1)[0]?.split('~');if(!values||values.length<40)throw new Error('接口没有返回该代码');const kind=values[0]==='1'?'ZS':values[0]==='100'?'HK':values[0]==='200'?'US':'A';const path=kind==='ZS'||kind==='A'?'kline/kline':'fqkline/get';const suffix=path==='kline/kline'?'':',qfq';const kr=await fetch(`https://web.ifzq.gtimg.cn/appstock/app/${path}?param=${encodeURIComponent(symbol)},day,,,24${suffix}`,{signal:AbortSignal.timeout(10000)}).catch(()=>null);const kj=kr?.ok?await kr.json():null;const points=(kj?.data?.[symbol]?.day||[]).map(row=>Number(row[2])).filter(Number.isFinite);return{symbol,name:values[1],exchange:values[2]||kind,currency:values[0]==='200'?values[35]:values[0]==='100'?'HKD':'CNY',price:Number(values[3]),change:Number(values[31]),pct:Number(values[32]),time:new Date(values[30].replace(/^(\d{4})(\d{2})(\d{2})/,'$1-$2-$3')).getTime()||Date.now(),points}}
function render(){cards.replaceChildren();if(!symbols.length){cards.innerHTML='<div class="empty">输入代码后添加。</div>';return}for(const s of symbols){const d=cache[s],q=document.createElement('article');q.className='quote';q.innerHTML=`<div class="sym"><span><span class="name">${esc(s)}</span><span class="exch">${d?esc(d.exchange):'加载中'}</span></span><button class="btn" data-remove="${esc(s)}" aria-label="移除 ${esc(s)}">✕</button></div>`;if(d){const cls=d.pct>0?'up':d.pct<0?'down':'flat';q.innerHTML+=`<p class="price">${fmt(d.price)}</p><p class="change ${cls}">${d.change>=0?'+':''}${fmt(d.change)} · ${d.pct>=0?'+':''}${fmt(d.pct)}% ${esc(d.currency)}</p>`;q.append(spark(d.points,d.pct));q.innerHTML+=`<div class="meta"><span>${esc(d.name)}</span><span>${new Date(d.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span></div>`}else q.innerHTML+=`<div class="empty" style="min-height:112px">${errors[s]?'读取失败：'+esc(errors[s]):'读取中…'}</div>`;cards.append(q)}cards.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{symbols=symbols.filter(x=>x!==b.dataset.remove);delete cache[b.dataset.remove];save();render()})}
async function refresh(manual=true){if(manual)updated.textContent='读取腾讯行情…';const requested=symbols.slice();const result=await Promise.allSettled(requested.map(fetchQuote));let ok=0;result.forEach((r,i)=>{if(!symbols.includes(requested[i]))return;if(r.status==='fulfilled'){cache[requested[i]]=r.value;delete errors[requested[i]];ok++}else{errors[requested[i]]=r.reason?.message||'网络或代码错误';cache[requested[i]]=cache[requested[i]]||null}});render();if(ok)updated.textContent=`已更新 ${ok}/${symbols.length} · 腾讯行情 · ${new Date().toLocaleTimeString('zh-CN')}`;else updated.textContent='读取失败：可能是网络、CSP、代码无效或接口变更。';return ok}
async function addSymbol(){const raw=document.getElementById('symbol').value.trim();if(!raw)return;updated.textContent='解析代码…';try{const s=await resolveSymbol(raw);if(symbols.includes(s)){updated.textContent='已在列表中：'+s;return}symbols=[...symbols,s].slice(-8);save();document.getElementById('symbol').value='';render();refresh()}catch(err){updated.textContent=`添加失败：${err.message||err}`}};
document.getElementById('add').onclick=addSymbol;document.getElementById('symbol').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addSymbol()}};document.getElementById('refresh').onclick=()=>refresh();symbols.slice(0,5).forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=()=>{document.getElementById('symbol').value=s};quick.append(b)});render();refresh();
</script></body></html>
