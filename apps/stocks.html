<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股票行情</title>
<style>:root{color-scheme:dark;--bg:#071018;--card:#0e1e2c;--line:#254456;--ink:#eef9ff;--muted:#8caebf;--cyan:#6ff2ff;--blue:#6f8bff;--up:#78e5a6;--down:#ff808d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(18px,4vw,46px);color:var(--ink);background:radial-gradient(640px 320px at 82% -12%,#215a7338,transparent),linear-gradient(150deg,var(--bg),#010810);font-family:"Avenir Next","PingFang SC","Noto Sans SC",sans-serif}.wrap{width:min(860px,100%);margin:auto}.eyebrow{margin:0 0 8px;color:var(--cyan);font:800 11px/1 "Courier New",monospace;letter-spacing:.32em}h1{margin:0 0 7px;font-size:clamp(31px,6vw,47px);letter-spacing:-.035em}.sub{margin:0 0 24px;color:var(--muted);font-size:13px}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.input{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 4px 3px 14px}.input input{flex:1;min-width:0;border:0;outline:0;color:var(--ink);background:transparent;font:inherit;padding:11px 0}.btn,button{cursor:pointer;color:var(--ink);font:inherit;background:#123040;border:1px solid var(--line);border-radius:12px;padding:12px 17px;transition:border-color .2s}.btn.primary{color:#03242b;background:linear-gradient(135deg,#9efaff,#64cfff);border-color:transparent;font-weight:750}.btn:hover{border-color:var(--cyan)}.ticker{margin-bottom:11px;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.quote{position:relative;overflow:hidden;padding:19px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#102a3c,var(--card));box-shadow:0 18px 45px #0005}.quote:before{content:"";position:absolute;width:110px;height:110px;right:-31px;top:-45px;border-radius:50%;background:#6ff2ff17}.sym{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}.name{font-size:19px;font-weight:780}.exch{display:block;margin-top:4px;color:var(--muted);font:650 10px "Courier New",monospace;letter-spacing:.16em}.price{margin:17px 0 3px;font:800 clamp(30px,7vw,37px)/1 "Courier New",monospace}.change{font:740 14px "Courier New",monospace}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:16px;border-top:1px solid #ffffff0d;padding-top:12px}.spark{display:block;width:100%;height:44px;margin-top:13px}.empty,.error{display:grid;place-items:center;min-height:200px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center;padding:20px;line-height:1.65}.error{color:#ffb7be;border-color:#663038}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{cursor:pointer;border:1px solid var(--line);color:var(--muted);background:#0a1824;border-radius:99px;padding:6px 11px;font:650 11px "Courier New",monospace;letter-spacing:.06em}.chip:hover{color:var(--cyan);border-color:var(--cyan)}@media(max-width:430px){.quote{padding:16px}.price{font-size:29px}}</style>
</head><body><main class="wrap"><p class="eyebrow">YAHOO FINANCE · PUBLIC CHART</p><h1>股票行情</h1><p class="sub">公开接口按需请求；数据仅作参考，不构成投资建议。</p><form class="bar" id="form"><label class="input"><span aria-hidden="true">🔎</span><input id="symbol" list="popular" value="AAPL" placeholder="输入代码，如 AAPL, NVDA, 0700.HK" aria-label="股票代码"><datalist id="popular"><option>AAPL</option><option>MSFT</option><option>NVDA</option><option>TSLA</option><option>0700.HK</option></datalist></label><button class="btn primary" type="submit">添加</button><button class="btn" id="refresh" type="button">刷新</button></form><div class="chips" id="quick" aria-label="快速添加"></div><p class="ticker" id="updated">尚未加载数据</p><section class="cards" id="cards" aria-live="polite"></section></main>
<script>
const DEFAULT=['AAPL','MSFT','NVDA','TSLA','0700.HK'],key='html-apps-stock-symbols-v1',cards=document.getElementById('cards'),updated=document.getElementById('updated'),quick=document.getElementById('quick');let symbols=[],cache={};try{symbols=JSON.parse(localStorage.getItem(key))||[]}catch{}symbols=symbols.filter(Boolean).slice(0,8);if(!symbols.length)symbols=DEFAULT.slice(0,4);
function save(){try{localStorage.setItem(key,JSON.stringify(symbols))}catch{}}function fmt(n,d=2){return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})}
function spark(points,up){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 100 30');svg.setAttribute('class','spark');svg.setAttribute('preserveAspectRatio','none');if(points&&points.length>1){let mn=Math.min(...points),mx=Math.max(...points);if(mx===mn)mx=mn+1;const d=points.map((v,i)=>`${i?'L':'M'}${(i/(points.length-1)*100).toFixed(2)},${(27-((v-mn)/(mx-mn))*24).toFixed(2)}`).join(' ');const line=document.createElementNS(ns,'path');line.setAttribute('d',d);line.setAttribute('fill','none');line.setAttribute('stroke',up>=0?'#78e5a6':'#ff808d');line.setAttribute('stroke-width','1.8');line.setAttribute('stroke-linecap','round');svg.append(line)}return svg}
async function fetchQuote(sym){const u=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=1d&interval=5m`;const r=await fetch(u);if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json(),q=j?.chart?.result?.[0];if(!q)throw new Error('接口没有返回该代码');const m=q.meta,closes=(q.indicators?.quote?.[0]?.close||[]).filter(x=>typeof x==='number');return{symbol:sym,name:m.shortName||m.longName||sym,exchange:m.fullExchangeName||m.exchangeName||'',currency:m.currency||'USD',price:m.regularMarketPrice,change:m.regularMarketPrice-m.chartPreviousClose,pct:(m.regularMarketPrice/m.chartPreviousClose-1)*100,time:m.regularMarketTime*1000,points:closes}}
function render(){cards.replaceChildren();if(!symbols.length){cards.innerHTML='<div class="empty">输入代码后添加。</div>';return}for(const s of symbols){const d=cache[s],q=document.createElement('article');q.className='quote';q.innerHTML=`<div class="sym"><span><span class="name">${s}</span><span class="exch">${d?d.exchange:'加载中'}</span></span><button class="btn" data-remove="${s}" aria-label="移除 ${s}">✕</button></div>`;if(d){const cls=d.pct>0?'up':d.pct<0?'down':'flat';q.innerHTML+=`<p class="price">${fmt(d.price)}</p><p class="change ${cls}">${d.change>=0?'+':''}${fmt(d.change)} · ${d.pct>=0?'+':''}${fmt(d.pct)}% ${d.currency}</p>`;q.append(spark(d.points,d.pct));q.innerHTML+=`<div class="meta"><span>${d.name}</span><span>${new Date(d.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span></div>`}else q.innerHTML+='<div class="empty" style="min-height:112px">读取中…</div>';cards.append(q)}cards.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{symbols=symbols.filter(x=>x!==b.dataset.remove);delete cache[b.dataset.remove];save();render()})}
async function refresh(manual=true){if(manual)updated.textContent='读取 Yahoo Finance…';const result=await Promise.allSettled(symbols.map(fetchQuote));let ok=0;result.forEach((r,i)=>{if(r.status==='fulfilled'){cache[symbols[i]]=r.value;ok++}else cache[symbols[i]]=cache[symbols[i]]||null});render();if(ok)updated.textContent=`已更新 ${ok}/${symbols.length} · Yahoo Finance · ${new Date().toLocaleTimeString('zh-CN')}`;else updated.textContent='读取失败：可能是网络、CSP 或代码无效。';return ok}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const s=document.getElementById('symbol').value.trim().toUpperCase();if(!s||symbols.includes(s))return;symbols=[...symbols,s].slice(-8);save();document.getElementById('symbol').value='';render();refresh()};
document.getElementById('refresh').onclick=()=>refresh();symbols.slice(0,5).forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=()=>{document.getElementById('symbol').value=s};quick.append(b)});render();refresh();
if(window.parent!==window){let id=0;const pending=new Map(),send=(m,p)=>parent.postMessage({jsonrpc:'2.0',method:m,params:p},'*'),ask=(m,p)=>new Promise((res,rej)=>{const x=++id,t=setTimeout(()=>rej(new Error('timeout')),9000);pending.set(x,{res,rej,t});send(m,p)});addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const d=e.data;if(d.id!=null&&!d.method){const x=pending.get(d.id);if(x){clearTimeout(x.t);pending.delete(d.id);d.error?x.rej(d.error):x.res(d.result)}}});ask('ui/initialize',{appInfo:{name:'local-html-apps',version:'1.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{send('ui/notifications/initialized',{});const rs=()=>send('ui/notifications/size-changed',{height:Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)+46});rs();new ResizeObserver(rs).observe(document.querySelector('.wrap'))}).catch(e=>console.warn(e.message))}
</script></body></html>
